<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#fdfcfa" />
  <title>名言シャッフル — meigen</title>
  <meta name="description" content="心に響く名言と、全然関係ない画像。※画像はイメージです" />

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="名言" />

  <style>
    :root {
      --paper: #fdfcfa;
      --ink: #1c1c1c;
      --sub: #6b6b6b;
      --faint: #9a9a9a;
      --line: #e4e2dd;
      --accent: #b0532f;
      --fade: 460ms;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Segoe UI", system-ui, sans-serif;
      color: var(--ink);
      background: var(--paper);
      position: relative;
      min-height: 100svh;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      user-select: none;
    }

    .serif { font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; }

    /* ===== Layout ===== */
    .app {
      position: relative;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      padding: calc(env(safe-area-inset-top) + 18px) 22px
               calc(env(safe-area-inset-bottom) + 22px);
    }

    header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      letter-spacing: 0.25em;
      font-size: 12px;
      color: var(--faint);
      text-transform: uppercase;
    }

    /* ===== Quote card ===== */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 0;
    }

    .quote {
      width: 100%;
      max-width: 520px;
      text-align: center;
      padding: 6px 6px 0;
      transition: opacity var(--fade) ease, transform var(--fade) cubic-bezier(.22,.61,.36,1);
    }
    .quote.is-out {
      opacity: 0;
      transform: translateY(14px) scale(0.985);
    }
    .quote.is-in {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    /* ランダム画像（全然関係ない） */
    .photo-wrap {
      max-width: 320px;
      margin: 0 auto 6px;
    }
    .photo {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      display: block;
      border: 1px solid var(--line);
      background: #f1efe9;
    }
    .photo-caption {
      font-size: 10.5px;
      color: var(--faint);
      letter-spacing: 0.08em;
      margin: 6px 0 18px;
    }

    .text {
      font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
      font-weight: 600;
      font-size: clamp(19px, 5.4vw, 28px);
      line-height: 1.85;
      letter-spacing: 0.04em;
      margin: 0 auto;
      text-wrap: balance;
    }

    .author {
      margin-top: 18px;
      font-size: clamp(12px, 3.4vw, 15px);
      color: var(--sub);
      letter-spacing: 0.08em;
    }
    .author::before {
      content: "— ";
      color: var(--accent);
    }

    /* ===== Meaning / note ===== */
    .note-toggle {
      appearance: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin: 18px auto 0;
      padding: 8px 16px;
      border-radius: 999px;
      font-family: inherit;
      font-size: 12.5px;
      letter-spacing: 0.08em;
      color: var(--accent);
      background: transparent;
      border: 1px solid var(--line);
      transition: transform 140ms ease, background 200ms ease;
    }
    .note-toggle svg { width: 15px; height: 15px; }
    .note-toggle:active { transform: scale(0.94); }
    .note-toggle[aria-expanded="true"] { background: #f6f4ef; }

    .note-wrap {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 380ms cubic-bezier(.22,.61,.36,1),
                  opacity 320ms ease, margin-top 380ms ease;
      opacity: 0;
      margin-top: 0;
    }
    .note-wrap.open {
      grid-template-rows: 1fr;
      opacity: 1;
      margin-top: 16px;
    }
    .note {
      overflow: hidden;
      margin: 0;
      font-weight: 400;
      font-size: clamp(13px, 3.7vw, 15px);
      line-height: 1.95;
      letter-spacing: 0.03em;
      color: var(--sub);
      text-align: left;
      background: #faf8f4;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 16px 18px;
    }

    /* ===== Controls ===== */
    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      margin-top: 8px;
    }

    .next-btn {
      appearance: none;
      cursor: pointer;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.1em;
      color: var(--paper);
      padding: 14px 44px;
      border-radius: 2px;
      background: var(--ink);
      border: 1px solid var(--ink);
      transition: transform 140ms ease, background 200ms ease;
    }
    .next-btn:active { transform: scale(0.96); }

    .icon-row {
      display: flex;
      gap: 14px;
    }
    .icon-btn {
      appearance: none;
      cursor: pointer;
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: transparent;
      border: 1px solid var(--line);
      color: var(--sub);
      transition: transform 140ms ease, background 200ms ease, border-color 200ms ease;
    }
    .icon-btn:active { transform: scale(0.9); }
    .icon-btn svg { width: 22px; height: 22px; }

    .icon-btn.fav.is-active {
      border-color: var(--accent);
      color: var(--accent);
    }
    .icon-btn.fav.is-active svg { fill: var(--accent); }
    @keyframes pop {
      0% { transform: scale(1); }
      45% { transform: scale(1.35); }
      100% { transform: scale(1); }
    }
    .icon-btn.pop { animation: pop 360ms ease; }

    .hint {
      text-align: center;
      font-size: 11px;
      color: var(--faint);
      letter-spacing: 0.12em;
      margin-top: 4px;
    }

    /* toast */
    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(env(safe-area-inset-bottom) + 110px);
      transform: translate(-50%, 20px);
      background: var(--ink);
      color: var(--paper);
      padding: 10px 20px;
      border-radius: 999px;
      font-size: 13px;
      letter-spacing: 0.06em;
      opacity: 0;
      pointer-events: none;
      transition: opacity 220ms ease, transform 220ms ease;
      z-index: 10;
    }
    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <span>名言シャッフル</span>
    </header>

    <!-- tappable area to shuffle -->
    <main id="tap-area">
      <figure class="quote is-in" id="quote">
        <div class="photo-wrap">
          <img class="photo" id="photo" alt="" />
          <p class="photo-caption">※画像はイメージです</p>
        </div>
        <blockquote class="text" id="text"></blockquote>
        <figcaption class="author" id="author"></figcaption>
        <button class="note-toggle" id="note-toggle" type="button" hidden aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 7.5h.01"/>
          </svg>
          <span class="note-toggle-label">意味をみる</span>
        </button>
        <div class="note-wrap" id="note-wrap">
          <p class="note" id="note"></p>
        </div>
      </figure>
    </main>

    <div class="controls">
      <button class="next-btn" id="next" type="button">次の名言</button>
      <div class="icon-row">
        <button class="icon-btn fav" id="fav" type="button" aria-label="お気に入り">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/>
          </svg>
        </button>
        <button class="icon-btn" id="copy" type="button" aria-label="コピー">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="11" height="11" rx="2.5"/>
            <path d="M5 15V5a2 2 0 0 1 2-2h10"/>
          </svg>
        </button>
        <button class="icon-btn" id="share" type="button" aria-label="シェア">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
            <path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/>
          </svg>
        </button>
      </div>
      <p class="hint">タップ・スワイプ・ボタンで次の名言へ</p>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="quotes.js"></script>
  <script>
    (function () {
      "use strict";

      var list = Array.isArray(window.QUOTES) ? window.QUOTES : [];
      var quoteEl = document.getElementById("quote");
      var textEl = document.getElementById("text");
      var authorEl = document.getElementById("author");
      var photoEl = document.getElementById("photo");
      var favBtn = document.getElementById("fav");
      var toastEl = document.getElementById("toast");
      var noteToggle = document.getElementById("note-toggle");
      var noteWrap = document.getElementById("note-wrap");
      var noteEl = document.getElementById("note");
      var noteLabel = noteToggle.querySelector(".note-toggle-label");

      var current = -1;
      var animating = false;

      var FAV_KEY = "meigen.favorites";

      function getFavs() {
        try { return JSON.parse(localStorage.getItem(FAV_KEY) || "[]"); }
        catch (e) { return []; }
      }
      function saveFavs(f) {
        try { localStorage.setItem(FAV_KEY, JSON.stringify(f)); } catch (e) {}
      }

      function keyOf(q) { return q.text + "|" + q.author; }

      function pickIndex() {
        if (list.length <= 1) return 0;
        var i;
        do { i = Math.floor(Math.random() * list.length); }
        while (i === current);
        return i;
      }

      /* 全然関係ない画像を選ぶ。
         - pravatar: フリー素材の「普通の人」の顔（偉人ではない）
         - picsum:   ランダムな風景・モノの写真 */
      function pickImageUrl() {
        if (Math.random() < 0.5) {
          var n = 1 + Math.floor(Math.random() * 70);
          return "https://i.pravatar.cc/480?img=" + n;
        }
        return "https://picsum.photos/seed/" + Math.floor(Math.random() * 100000) + "/640/480";
      }

      function refreshFavState() {
        var q = list[current];
        if (!q) return;
        var favs = getFavs();
        var on = favs.indexOf(keyOf(q)) !== -1;
        favBtn.classList.toggle("is-active", on);
      }

      function collapseNote() {
        noteWrap.classList.remove("open");
        noteToggle.setAttribute("aria-expanded", "false");
        noteLabel.textContent = "意味をみる";
      }

      function render(i) {
        current = i;
        var q = list[i];
        textEl.textContent = q.text;
        authorEl.textContent = q.author;
        photoEl.src = pickImageUrl();

        // 解説(note)があるものだけ「意味をみる」ボタンを表示
        collapseNote();
        if (q.note) {
          noteEl.textContent = q.note;
          noteToggle.hidden = false;
        } else {
          noteEl.textContent = "";
          noteToggle.hidden = true;
        }

        refreshFavState();
      }

      // 画像が取れなかったら枠ごと目立たなくする（オフライン等）
      photoEl.addEventListener("error", function () {
        photoEl.style.visibility = "hidden";
      });
      photoEl.addEventListener("load", function () {
        photoEl.style.visibility = "visible";
      });

      function show(i) {
        // fade out -> swap -> fade in
        if (animating) return;
        animating = true;
        quoteEl.classList.remove("is-in");
        quoteEl.classList.add("is-out");
        window.setTimeout(function () {
          render(i);
          // force reflow so the transition restarts cleanly
          void quoteEl.offsetWidth;
          quoteEl.classList.remove("is-out");
          quoteEl.classList.add("is-in");
          animating = false;
        }, 320);
      }

      function shuffle() {
        show(pickIndex());
      }

      var toastTimer;
      function toast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add("show");
        window.clearTimeout(toastTimer);
        toastTimer = window.setTimeout(function () {
          toastEl.classList.remove("show");
        }, 1600);
      }

      function vibrate(ms) {
        if (navigator.vibrate) { try { navigator.vibrate(ms); } catch (e) {} }
      }

      // ===== Events =====
      document.getElementById("next").addEventListener("click", function (e) {
        e.stopPropagation();
        shuffle();
      });

      // tap on the quote area to shuffle
      document.getElementById("tap-area").addEventListener("click", function () {
        shuffle();
      });

      // 「意味をみる」トグル（タップでシャッフルされないよう伝播を止める）
      noteToggle.addEventListener("click", function (e) {
        e.stopPropagation();
        var open = noteWrap.classList.toggle("open");
        noteToggle.setAttribute("aria-expanded", open ? "true" : "false");
        noteLabel.textContent = open ? "とじる" : "意味をみる";
      });
      // 解説を読んでいる間のタップでシャッフルさせない
      noteWrap.addEventListener("click", function (e) {
        e.stopPropagation();
      });

      // favorite
      favBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        var q = list[current];
        if (!q) return;
        var favs = getFavs();
        var k = keyOf(q);
        var idx = favs.indexOf(k);
        if (idx === -1) {
          favs.push(k);
          toast("お気に入りに追加しました ♡");
          vibrate(15);
        } else {
          favs.splice(idx, 1);
          toast("お気に入りから削除しました");
        }
        saveFavs(favs);
        refreshFavState();
        favBtn.classList.remove("pop");
        void favBtn.offsetWidth;
        favBtn.classList.add("pop");
      });

      // copy
      document.getElementById("copy").addEventListener("click", function (e) {
        e.stopPropagation();
        var q = list[current];
        if (!q) return;
        var str = "「" + q.text + "」\n— " + q.author;
        var done = function () { toast("コピーしました"); vibrate(15); };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(str).then(done, function () { fallbackCopy(str, done); });
        } else {
          fallbackCopy(str, done);
        }
      });

      function fallbackCopy(str, done) {
        var ta = document.createElement("textarea");
        ta.value = str;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand("copy"); done(); }
        catch (e) { toast("コピーできませんでした"); }
        document.body.removeChild(ta);
      }

      // share
      document.getElementById("share").addEventListener("click", function (e) {
        e.stopPropagation();
        var q = list[current];
        if (!q) return;
        var str = "「" + q.text + "」\n— " + q.author;
        if (navigator.share) {
          navigator.share({ text: str, title: "名言シャッフル" }).catch(function () {});
        } else {
          if (navigator.clipboard) {
            navigator.clipboard.writeText(str).then(function () {
              toast("コピーしました（シェア用）");
            });
          } else {
            toast("シェアに対応していません");
          }
        }
      });

      // keyboard (desktop convenience)
      document.addEventListener("keydown", function (e) {
        if (e.key === " " || e.key === "ArrowRight" || e.key === "ArrowLeft" || e.key === "Enter") {
          e.preventDefault();
          shuffle();
        } else if (e.key.toLowerCase() === "f") {
          favBtn.click();
        }
      });

      // ===== Swipe (touch) =====
      var sx = 0, sy = 0, moved = false, touching = false;
      var THRESH = 45;
      var win = document.querySelector(".app");

      win.addEventListener("touchstart", function (e) {
        if (e.touches.length !== 1) return;
        touching = true;
        moved = false;
        sx = e.touches[0].clientX;
        sy = e.touches[0].clientY;
      }, { passive: true });

      win.addEventListener("touchmove", function (e) {
        if (!touching) return;
        var dx = e.touches[0].clientX - sx;
        var dy = e.touches[0].clientY - sy;
        if (Math.abs(dx) > 10 || Math.abs(dy) > 10) moved = true;
      }, { passive: true });

      win.addEventListener("touchend", function (e) {
        if (!touching) return;
        touching = false;
        var t = e.changedTouches[0];
        var dx = t.clientX - sx;
        var dy = t.clientY - sy;
        if (Math.abs(dx) > THRESH && Math.abs(dx) > Math.abs(dy)) {
          shuffle();
        }
      }, { passive: true });

      // ===== Init =====
      if (list.length === 0) {
        textEl.textContent = "名言データが読み込めませんでした。quotes.js を確認してください。";
        authorEl.textContent = "";
      } else {
        render(pickIndex());
      }

      // ===== Service worker =====
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("sw.js").catch(function () {});
        });
      }
    })();
  </script>
</body>
</html>
