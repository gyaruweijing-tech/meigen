<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#3a2a78" />
  <title>名言シャッフル — meigen</title>
  <meta name="description" content="心に響く名言をランダムに表示するシンプルなアプリ。タップやスワイプで次の名言へ。" />

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="名言" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-0: #241a52;
      --bg-1: #3a2a78;
      --ink: #fbf9ff;
      --ink-soft: rgba(251, 249, 255, 0.78);
      --accent: #c4a8ff;
      --accent-2: #ff9ecb;
      --card: rgba(255, 255, 255, 0.10);
      --card-border: rgba(255, 255, 255, 0.20);
      --fade: 460ms;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: "Zen Kaku Gothic New", system-ui, sans-serif;
      color: var(--ink);
      background: var(--bg-0);
      position: relative;
      min-height: 100svh;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      user-select: none;
    }

    /* ===== Animated background ===== */
    .bg {
      position: fixed;
      inset: 0;
      z-index: -2;
      background:
        radial-gradient(120% 90% at 15% 8%, #6a4fd0 0%, transparent 58%),
        radial-gradient(110% 80% at 85% 92%, #c75ea8 0%, transparent 58%),
        radial-gradient(90% 70% at 90% 12%, #4f73e0 0%, transparent 55%),
        linear-gradient(160deg, var(--bg-1), var(--bg-0) 72%);
    }

    /* slowly drifting blobs */
    .blob {
      position: fixed;
      z-index: -1;
      border-radius: 50%;
      filter: blur(70px);
      opacity: 0.7;
      will-change: transform;
    }
    .blob.b1 {
      width: 46vmax; height: 46vmax;
      left: -14vmax; top: -10vmax;
      background: radial-gradient(circle at 30% 30%, #9a72ff, transparent 70%);
      animation: drift1 26s ease-in-out infinite;
    }
    .blob.b2 {
      width: 40vmax; height: 40vmax;
      right: -12vmax; bottom: -12vmax;
      background: radial-gradient(circle at 70% 70%, #ff7db8, transparent 70%);
      animation: drift2 32s ease-in-out infinite;
    }
    .blob.b3 {
      width: 30vmax; height: 30vmax;
      right: 8vmax; top: 12vmax;
      background: radial-gradient(circle at 50% 50%, #5fa8ff, transparent 70%);
      opacity: 0.5;
      animation: drift3 22s ease-in-out infinite;
    }

    @keyframes drift1 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50%      { transform: translate(6vmax, 5vmax) scale(1.12); }
    }
    @keyframes drift2 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50%      { transform: translate(-5vmax, -6vmax) scale(1.15); }
    }
    @keyframes drift3 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50%      { transform: translate(-4vmax, 4vmax) scale(0.9); }
    }

    /* subtle star/grain overlay */
    .grain {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      opacity: 0.04;
      background-image: radial-gradient(rgba(255,255,255,0.9) 0.5px, transparent 0.6px);
      background-size: 4px 4px;
    }

    @media (prefers-reduced-motion: reduce) {
      .blob { animation: none; }
    }

    /* ===== Layout ===== */
    .app {
      position: relative;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      padding: calc(env(safe-area-inset-top) + 18px) 22px
               calc(env(safe-area-inset-bottom) + 22px);
    }

    header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: "Shippori Mincho", serif;
      letter-spacing: 0.22em;
      font-size: 13px;
      color: var(--ink-soft);
      text-transform: none;
    }
    header .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
    }

    /* ===== Quote card ===== */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    .quote {
      width: 100%;
      max-width: 600px;
      text-align: center;
      padding: 6px 6px 0;
      transition: opacity var(--fade) ease, transform var(--fade) cubic-bezier(.22,.61,.36,1);
    }
    .quote.is-out {
      opacity: 0;
      transform: translateY(14px) scale(0.985);
    }
    .quote.is-in {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .mark {
      font-family: "Shippori Mincho", serif;
      font-size: 64px;
      line-height: 0.4;
      color: var(--accent);
      opacity: 0.5;
      display: block;
      margin-bottom: 14px;
      text-shadow: 0 0 24px rgba(154, 123, 255, 0.4);
    }

    .text {
      font-family: "Shippori Mincho", serif;
      font-weight: 600;
      font-size: clamp(22px, 6.4vw, 34px);
      line-height: 1.85;
      letter-spacing: 0.04em;
      margin: 0 auto;
      text-wrap: balance;
      text-shadow: 0 2px 30px rgba(0, 0, 0, 0.35);
    }

    .author {
      margin-top: 30px;
      font-size: clamp(13px, 3.6vw, 16px);
      color: var(--ink-soft);
      letter-spacing: 0.08em;
      font-weight: 500;
    }
    .author::before {
      content: "— ";
      color: var(--accent);
    }

    /* ===== Meaning / note ===== */
    .note-toggle {
      appearance: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin: 20px auto 0;
      padding: 8px 16px;
      border-radius: 999px;
      font-family: inherit;
      font-size: 12.5px;
      letter-spacing: 0.08em;
      color: var(--accent);
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      transition: transform 140ms ease, background 200ms ease;
    }
    .note-toggle svg { width: 15px; height: 15px; }
    .note-toggle:active { transform: scale(0.94); }
    .note-toggle[aria-expanded="true"] {
      background: rgba(196, 168, 255, 0.16);
    }

    .note-wrap {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 380ms cubic-bezier(.22,.61,.36,1),
                  opacity 320ms ease, margin-top 380ms ease;
      opacity: 0;
      margin-top: 0;
    }
    .note-wrap.open {
      grid-template-rows: 1fr;
      opacity: 1;
      margin-top: 16px;
    }
    .note {
      overflow: hidden;
      margin: 0;
      font-family: "Zen Kaku Gothic New", sans-serif;
      font-weight: 400;
      font-size: clamp(13px, 3.7vw, 15.5px);
      line-height: 1.95;
      letter-spacing: 0.03em;
      color: rgba(251, 249, 255, 0.86);
      text-align: left;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px 18px;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    /* ===== Controls ===== */
    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      margin-top: 8px;
    }

    .next-btn {
      appearance: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: #fff;
      padding: 15px 40px;
      border-radius: 999px;
      background: linear-gradient(120deg, var(--accent), var(--accent-2));
      box-shadow: 0 10px 30px rgba(122, 74, 255, 0.35),
                  inset 0 1px 0 rgba(255,255,255,0.25);
      transition: transform 140ms ease, box-shadow 140ms ease, filter 140ms ease;
    }
    .next-btn:active {
      transform: scale(0.95);
      filter: brightness(1.05);
    }

    .icon-row {
      display: flex;
      gap: 14px;
    }
    .icon-btn {
      appearance: none;
      cursor: pointer;
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--card);
      border: 1px solid var(--card-border);
      color: var(--ink);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: transform 140ms ease, background 200ms ease, border-color 200ms ease;
    }
    .icon-btn:active { transform: scale(0.9); }
    .icon-btn svg { width: 24px; height: 24px; }

    .icon-btn.fav.is-active {
      background: rgba(255, 94, 162, 0.16);
      border-color: rgba(255, 94, 162, 0.55);
      color: var(--accent-2);
    }
    .icon-btn.fav.is-active svg { fill: var(--accent-2); }
    @keyframes pop {
      0% { transform: scale(1); }
      45% { transform: scale(1.35); }
      100% { transform: scale(1); }
    }
    .icon-btn.pop { animation: pop 360ms ease; }

    .hint {
      text-align: center;
      font-size: 11.5px;
      color: rgba(244,241,255,0.34);
      letter-spacing: 0.12em;
      margin-top: 4px;
    }

    /* toast */
    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(env(safe-area-inset-bottom) + 110px);
      transform: translate(-50%, 20px);
      background: rgba(20, 16, 30, 0.92);
      border: 1px solid var(--card-border);
      color: var(--ink);
      padding: 10px 20px;
      border-radius: 999px;
      font-size: 13px;
      letter-spacing: 0.06em;
      opacity: 0;
      pointer-events: none;
      transition: opacity 220ms ease, transform 220ms ease;
      backdrop-filter: blur(8px);
      z-index: 10;
    }
    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
  <div class="grain"></div>

  <div class="app">
    <header>
      <span class="dot"></span>
      <span>名言シャッフル</span>
    </header>

    <!-- tappable area to shuffle -->
    <main id="tap-area">
      <figure class="quote is-in" id="quote">
        <span class="mark" aria-hidden="true">&#8220;</span>
        <blockquote class="text" id="text"></blockquote>
        <figcaption class="author" id="author"></figcaption>
        <button class="note-toggle" id="note-toggle" type="button" hidden aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 7.5h.01"/>
          </svg>
          <span class="note-toggle-label">意味をみる</span>
        </button>
        <div class="note-wrap" id="note-wrap">
          <p class="note" id="note"></p>
        </div>
      </figure>
    </main>

    <div class="controls">
      <button class="next-btn" id="next" type="button">次の名言</button>
      <div class="icon-row">
        <button class="icon-btn fav" id="fav" type="button" aria-label="お気に入り">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/>
          </svg>
        </button>
        <button class="icon-btn" id="copy" type="button" aria-label="コピー">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="11" height="11" rx="2.5"/>
            <path d="M5 15V5a2 2 0 0 1 2-2h10"/>
          </svg>
        </button>
        <button class="icon-btn" id="share" type="button" aria-label="シェア">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
            <path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/>
          </svg>
        </button>
      </div>
      <p class="hint">タップ・スワイプ・ボタンで次の名言へ</p>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="quotes.js"></script>
  <script>
    (function () {
      "use strict";

      var list = Array.isArray(window.QUOTES) ? window.QUOTES : [];
      var quoteEl = document.getElementById("quote");
      var textEl = document.getElementById("text");
      var authorEl = document.getElementById("author");
      var favBtn = document.getElementById("fav");
      var toastEl = document.getElementById("toast");
      var noteToggle = document.getElementById("note-toggle");
      var noteWrap = document.getElementById("note-wrap");
      var noteEl = document.getElementById("note");
      var noteLabel = noteToggle.querySelector(".note-toggle-label");

      var current = -1;
      var animating = false;

      var FAV_KEY = "meigen.favorites";

      function getFavs() {
        try { return JSON.parse(localStorage.getItem(FAV_KEY) || "[]"); }
        catch (e) { return []; }
      }
      function saveFavs(f) {
        try { localStorage.setItem(FAV_KEY, JSON.stringify(f)); } catch (e) {}
      }

      function keyOf(q) { return q.text + "|" + q.author; }

      function pickIndex() {
        if (list.length <= 1) return 0;
        var i;
        do { i = Math.floor(Math.random() * list.length); }
        while (i === current);
        return i;
      }

      function refreshFavState() {
        var q = list[current];
        if (!q) return;
        var favs = getFavs();
        var on = favs.indexOf(keyOf(q)) !== -1;
        favBtn.classList.toggle("is-active", on);
      }

      function collapseNote() {
        noteWrap.classList.remove("open");
        noteToggle.setAttribute("aria-expanded", "false");
        noteLabel.textContent = "意味をみる";
      }

      function render(i) {
        current = i;
        var q = list[i];
        textEl.textContent = q.text;
        authorEl.textContent = q.author;

        // 解説(note)があるものだけ「意味をみる」ボタンを表示
        collapseNote();
        if (q.note) {
          noteEl.textContent = q.note;
          noteToggle.hidden = false;
        } else {
          noteEl.textContent = "";
          noteToggle.hidden = true;
        }

        refreshFavState();
      }

      function show(i) {
        // fade out -> swap -> fade in
        if (animating) return;
        animating = true;
        quoteEl.classList.remove("is-in");
        quoteEl.classList.add("is-out");
        window.setTimeout(function () {
          render(i);
          // force reflow so the transition restarts cleanly
          void quoteEl.offsetWidth;
          quoteEl.classList.remove("is-out");
          quoteEl.classList.add("is-in");
          animating = false;
        }, 320);
      }

      function shuffle() {
        show(pickIndex());
      }

      var toastTimer;
      function toast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add("show");
        window.clearTimeout(toastTimer);
        toastTimer = window.setTimeout(function () {
          toastEl.classList.remove("show");
        }, 1600);
      }

      function vibrate(ms) {
        if (navigator.vibrate) { try { navigator.vibrate(ms); } catch (e) {} }
      }

      // ===== Events =====
      document.getElementById("next").addEventListener("click", function (e) {
        e.stopPropagation();
        shuffle();
      });

      // tap on the quote area to shuffle
      document.getElementById("tap-area").addEventListener("click", function () {
        shuffle();
      });

      // 「意味をみる」トグル（タップでシャッフルされないよう伝播を止める）
      noteToggle.addEventListener("click", function (e) {
        e.stopPropagation();
        var open = noteWrap.classList.toggle("open");
        noteToggle.setAttribute("aria-expanded", open ? "true" : "false");
        noteLabel.textContent = open ? "とじる" : "意味をみる";
      });
      // 解説を読んでいる間のタップでシャッフルさせない
      noteWrap.addEventListener("click", function (e) {
        e.stopPropagation();
      });

      // favorite
      favBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        var q = list[current];
        if (!q) return;
        var favs = getFavs();
        var k = keyOf(q);
        var idx = favs.indexOf(k);
        if (idx === -1) {
          favs.push(k);
          toast("お気に入りに追加しました ♡");
          vibrate(15);
        } else {
          favs.splice(idx, 1);
          toast("お気に入りから削除しました");
        }
        saveFavs(favs);
        refreshFavState();
        favBtn.classList.remove("pop");
        void favBtn.offsetWidth;
        favBtn.classList.add("pop");
      });

      // copy
      document.getElementById("copy").addEventListener("click", function (e) {
        e.stopPropagation();
        var q = list[current];
        if (!q) return;
        var str = "「" + q.text + "」\n— " + q.author;
        var done = function () { toast("コピーしました"); vibrate(15); };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(str).then(done, function () { fallbackCopy(str, done); });
        } else {
          fallbackCopy(str, done);
        }
      });

      function fallbackCopy(str, done) {
        var ta = document.createElement("textarea");
        ta.value = str;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand("copy"); done(); }
        catch (e) { toast("コピーできませんでした"); }
        document.body.removeChild(ta);
      }

      // share
      document.getElementById("share").addEventListener("click", function (e) {
        e.stopPropagation();
        var q = list[current];
        if (!q) return;
        var str = "「" + q.text + "」\n— " + q.author;
        if (navigator.share) {
          navigator.share({ text: str, title: "名言シャッフル" }).catch(function () {});
        } else {
          if (navigator.clipboard) {
            navigator.clipboard.writeText(str).then(function () {
              toast("コピーしました（シェア用）");
            });
          } else {
            toast("シェアに対応していません");
          }
        }
      });

      // keyboard (desktop convenience)
      document.addEventListener("keydown", function (e) {
        if (e.key === " " || e.key === "ArrowRight" || e.key === "ArrowLeft" || e.key === "Enter") {
          e.preventDefault();
          shuffle();
        } else if (e.key.toLowerCase() === "f") {
          favBtn.click();
        }
      });

      // ===== Swipe (touch) =====
      var sx = 0, sy = 0, moved = false, touching = false;
      var THRESH = 45;
      var win = document.querySelector(".app");

      win.addEventListener("touchstart", function (e) {
        if (e.touches.length !== 1) return;
        touching = true;
        moved = false;
        sx = e.touches[0].clientX;
        sy = e.touches[0].clientY;
      }, { passive: true });

      win.addEventListener("touchmove", function (e) {
        if (!touching) return;
        var dx = e.touches[0].clientX - sx;
        var dy = e.touches[0].clientY - sy;
        if (Math.abs(dx) > 10 || Math.abs(dy) > 10) moved = true;
      }, { passive: true });

      win.addEventListener("touchend", function (e) {
        if (!touching) return;
        touching = false;
        var t = e.changedTouches[0];
        var dx = t.clientX - sx;
        var dy = t.clientY - sy;
        if (Math.abs(dx) > THRESH && Math.abs(dx) > Math.abs(dy)) {
          shuffle();
        }
      }, { passive: true });

      // ===== Init =====
      if (list.length === 0) {
        textEl.textContent = "名言データが読み込めませんでした。quotes.js を確認してください。";
        authorEl.textContent = "";
      } else {
        render(pickIndex());
      }

      // ===== Service worker =====
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("sw.js").catch(function () {});
        });
      }
    })();
  </script>
</body>
</html>
